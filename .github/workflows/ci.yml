name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No `tags:` trigger here on purpose: this repo's release flow always pushes
# the version-bump commit and its tag together in one `git push origin main
# vX.Y.Z`, which is two ref updates and therefore two separate push events —
# a `tags:` filter would start a second full run for the same commit. The
# `check-tag` job below detects the tag from the single branch-triggered run
# instead. (A bare tag push, with no branch push alongside it, won't trigger
# CI at all under this scheme — not a flow this repo uses.)

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engine's floor (engines.node), the current 22.x, and the next
        # major — a regression tied to a specific patch would slip through
        # a single-version matrix.
        node: ["22.19.0", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:cli
      # ui_server.test.ts serves the packaged web/ SPA, so it must exist
      # before `npm test` runs here too, not just in the pack job.
      - run: npm run build:app
      - run: npm test

  pack:
    name: pack (build, size gate)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm run size-check
      - run: npm pack --dry-run

  check-tag:
    name: check for a version tag on this commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: tag
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1 || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    name: publish (npm, trusted publishing)
    runs-on: ubuntu-latest
    needs: [test, pack, check-tag]
    if: needs.check-tag.outputs.tag != ''
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing (and the provenance it generates automatically)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >=11.5.1 — don't rely on whatever
      # happens to ship with actions/setup-node's Node 22 at build time.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm run size-check
      # No NODE_AUTH_TOKEN / secrets.NPM_TOKEN: this repo's GitHub Actions
      # workflow is registered as a Trusted Publisher on npmjs.com for
      # @gr8ful/spf (Packages -> @gr8ful/spf -> Settings -> Trusted
      # publishing), so npm exchanges this job's own OIDC token for a
      # short-lived publish credential instead of a long-lived secret.
      # Provenance is generated automatically by trusted publishing — no
      # --provenance flag needed.
      - run: npm publish --access public
