name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No `tags:` trigger here on purpose: the ONLY thing that ever pushes a
# version tag in this repo is the `check-tag` job below, once a version bump
# has landed on `main` and tests/pack have passed there. Triggering on
# `tags:` too would start a second, redundant run for a tag `check-tag` just
# pushed itself.
#
# `scripts/tag-release.js` (`npm run tag:*`) no longer creates a tag at all —
# it just bumps the version and commits, runnable from a feature branch (open
# a PR, merge it normally) or directly on `main`. A tag created before a PR
# merge couldn't survive it anyway: none of GitHub's merge methods (merge
# commit, squash, rebase) preserve the original commit's SHA onto `main`, so
# a pre-merge tag would end up pointing at an ancestor of `main`, never its
# tip. `check-tag` instead runs on the post-merge `push` to `main`, compares
# `package.json`'s version against the last released tag, and creates the new
# one itself if it moved — merge-method-proof by construction.

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engine's floor (engines.node), the current 22.x, and the next
        # major — a regression tied to a specific patch would slip through
        # a single-version matrix.
        node: ["22.19.0", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:cli
      # ui_server.test.ts serves the packaged web/ SPA, so it must exist
      # before `npm test` runs here too, not just in the pack job.
      - run: npm run build:app
      - run: npm test

  pack:
    name: pack (build, size gate)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm run size-check
      - run: npm pack --dry-run

  check-tag:
    name: tag a version bump on main
    runs-on: ubuntu-latest
    # Gated on both: never tag a commit whose build/pack we haven't verified
    # (a broken version bump must not leave a real release tag behind), and
    # never run on a `pull_request` trigger (that would tag a PR's merge-ref
    # commit before the PR has actually landed on `main`).
    needs: [test, pack]
    if: github.event_name == 'push'
    permissions:
      contents: write # to create and push the release tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: tag
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION already exists — not a new release."
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "$VERSION"
            git push origin "$VERSION"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: publish (npm, trusted publishing)
    runs-on: ubuntu-latest
    needs: [test, pack, check-tag]
    if: needs.check-tag.outputs.tag != ''
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing (and the provenance it generates automatically)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >=11.5.1 — don't rely on whatever
      # happens to ship with actions/setup-node's Node 22 at build time.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm run size-check
      # No NODE_AUTH_TOKEN / secrets.NPM_TOKEN: this repo's GitHub Actions
      # workflow is registered as a Trusted Publisher on npmjs.com for
      # @gr8ful/spf (Packages -> @gr8ful/spf -> Settings -> Trusted
      # publishing), so npm exchanges this job's own OIDC token for a
      # short-lived publish credential instead of a long-lived secret.
      # Provenance is generated automatically by trusted publishing — no
      # --provenance flag needed.
      - run: npm publish --access public
