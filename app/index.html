    <!--
      DIRECTION CONTRACT (seed 22a96b62 — The Timetable, user-pinned)

      THESIS: Runs read like a printed timetable; live traces behave like a
      departure board. SPF reviews agent runs as service records — trust is
      earned by print, not by glow.

      OWN-WORLD: Two artifacts, one grammar. The sessions list is ink on paper
      — columns, hairlines, a ballpoint annotation for the one run in flight.
      The trace is amber and bone on board-black — track numbers, squared
      bays, status as the only hue. The previous aurora/glass/gradient world
      is the recorded anti-reference and does not survive in any component.

      STORY: An engineer audits what the factory built overnight. The paper
      timetable answers "what ran, what passed, what cost what"; stepping into
      a run flips the world to the board, where the live phase flips its
      letters like a split-flap and status alone carries color.

      FIRST VIEWPORT: On the list, the printed page — a masthead with the
      station-code mark, then column-headed departure rows. On a run, the
      board strip — request, status, totals — above the tracked lanes.

      FORM: Overpass/Overpass Mono, 16px floor; square 2px cells; one hairline
      grid; Accents Don't Travel (red/ballpoint stay on paper, amber stays on
      the board); Color Is Signal (only amber-live, green-pass, red-fail);
      Data Voice (mono is for numbers); the board flips, the paper never moves.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
