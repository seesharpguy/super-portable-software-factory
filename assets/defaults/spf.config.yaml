# spf.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
# Runs on Flue (@flue/runtime) — coding_agent: flue is the only implemented value.
defaults:
  coding_agent: flue
  model: google/gemini-3.6-flash   # provider/id — a bare pattern is ambiguous across providers
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
  harness_engineering: []          # no Flue analogue — must stay empty, see agents.validate()
  # Roster-wide allowlist; any agent may override with its own list. Known
  # names: read, write, edit, bash, grep, glob, find (alias for glob). "ls" is
  # a known name with no Flue builtin (bash/glob cover it) — harmless to list,
  # it is simply dropped rather than mounted.
  tools:
    - read                         # read file contents
    - bash                         # execute bash commands
    - edit                         # find/replace edits
    - write                        # create/overwrite files
    - grep                         # search file contents  (pi default: OFF)
    - find                         # find files by glob     (pi default: OFF)
    - ls                           # list directories       (pi default: OFF)
  # Off-limits to every agent that does not name them in its own `writes`.
  # `tools` alone cannot protect these: bash runs `git checkout`, and write
  # reaches any path. An agent must not be able to edit the machinery that
  # decides whether its own work passed. Enforced in core/permissions.ts.
  #
  # `writes:` per agent says what it may change IN THE REPO. It never restricts
  # the session runtime under data_dir — context_handoff/, envelopes, prompts,
  # raw output. Every agent can always write its own report; `writes: []` means
  # read-only with respect to the repo, not mute.
  protected_files:
    - .spf/
    - spf.config.yaml
  data_dir: .spf/data               # runtime home: {data_dir}/sessions/{adw_id}/{agent_name}/

observability:
  db: .spf/data/spf.db               # tracer writes here directly; the UI polls it
  poll_ms: 500                     # visualizer live-poll cadence
  # Optional OpenTelemetry spans export (explicit config only; no ambient env activation)
  # otel:
  #   endpoint: https://your-otel-collector/v1/traces
  #   service_name: spf                    # optional; default "spf"
  #   headers:                             # optional; e.g. auth headers
  #     Authorization: Bearer ...

# No default quality checks or suites are shipped — an unconfigured chain
# that needs one fails loudly at agents.validate() time (before anything
# spawns) rather than reporting a placeholder green. Add your own, e.g.:
#   quality:
#     checks:
#       - {name: test, operation: build, argv: ["npm", "test"], timeout_seconds: 600}
#       - {name: lint, operation: lint, argv: ["npx", "eslint", "."], timeout_seconds: 120}
#     suites:
#       test: [test]
#       all: [test, lint]

# OFF by default, and absence/false is a TOTAL no-op: every agent dispatches
# at exactly the model its roster entry names, byte-identically to before
# this key existed. Same discipline as max_run_cost/max_run_tokens
# (data_types.ts:463-491): a repo that upgrades must not silently start
# routing its phases to different models.
#
# Turning it on is a deliberate edit, or `spf init --template ts-flue-ollama`
# (the one packaged template whose two rungs are MEASURED). `spf init`'s
# interview does NOT write this block — see config.md's "tiering" section
# for why.
tiering:
  enabled: false

  # The ladder, WEAKEST FIRST. A SEQUENCE, not a mapping: order is the whole
  # semantics here (a risk level shifts every routed role UP or DOWN this
  # list), and a YAML sequence states order unambiguously where a mapping
  # would make it depend on the parser preserving key order.
  #
  # `coding_agent` (default "flue", the same default an agent's own field
  # uses) declares WHICH BACKEND'S VOCABULARY this rung's `model` speaks. It
  # is not optional in spirit: a tier changes an agent's `model` and NOTHING
  # else — `coding_agent` is a per-agent field and always stays the agent's
  # own — so a rung can only route roles whose backend matches. See
  # config.md's "tiering" section for rule T, and note that this is what
  # makes "validated by the same backend branch agents.validate() uses" an
  # answerable question: the branch is the TIER's declared backend.
  #
  # `model` then speaks EXACTLY the same vocabulary as an agent's own `model:`
  # for that backend — provider/model-id for flue, Claude Code's bare alias for
  # claude_code. There is deliberately no per-provider table: for flue the
  # provider is already the first segment of the value.
  #
  # WHEN tiering.enabled, `spf doctor` runs the SAME provider-key and
  # model-shape checks over these rungs that it already runs over
  # cfg.agents[].model — a rung naming a provider whose key is unset is a
  # green doctor and a first-dispatch failure otherwise. When tiering is
  # DISABLED (which is this file's shipped state) doctor does not look at
  # `tiers` at all, so shipping this populated ladder cannot fail `spf
  # doctor` in a repo that never opted in.
  tiers:
    - { name: scout,   coding_agent: flue, model: google/gemini-3.6-flash }
    - { name: builder, coding_agent: flue, model: fireworks/accounts/fireworks/models/kimi-k3 }
    - { name: deep,    coding_agent: flue, model: openai/gpt-5.6-terra }

  # Baseline tier per ROLE (an agent name). Naming an agent here IS the
  # operator's statement "route this one by tier" — so the resolved tier wins
  # over that agent's own `model:`. An agent NOT named here is never retiered:
  # its `model:` stands, untouched. That is the whole precedence rule.
  #
  # A key naming an agent this repo's roster does not define is NOT a global
  # error — it is only reported for a chain that actually requires that
  # agent. A pruned or renamed roster must not fail every chain.
  #
  # NOTE for the two packaged templates that set `defaults.coding_agent:
  # claude_code` (ts, ts-cc): this `roles` map and the flue-shaped `tiers`
  # above survive into their effective config through key-by-key merge. That
  # is harmless while `enabled: false`. Flip `enabled: true` there without
  # also declaring your own ladder and validate() fails LOUDLY by name on the
  # backend mismatch (rule T) rather than dispatching a `fireworks/...` id
  # through Claude Code.
  roles:
    scout:      scout
    documenter: scout
    planner:    builder
    builder:    builder
    refiner:    builder
    reviewer:   deep

# Remote sandbox backends (SPF #15) — everything below is optional; omitting
# the whole block means backend: local, i.e. byte-identical to SPF before
# this feature existed (every agent's tools run against the real working
# tree, exactly as today). See config.md's "sandbox" section for the full
# field-by-field rationale — this is the commented-out shape only.
# sandbox:
#   backend: local              # local | opensandbox | cloudflare   (default: local)
#   scope: agent                # agent (DEFAULT) | run — see config.md: "run" is only safe
#                                # when every dispatched agent resolves to the SAME env key set.
#   workspace_dir: /workspace   # absolute path INSIDE the sandbox; the agent's cwd
#   handoff_dir: /spf/handoff   # absolute path INSIDE the sandbox — MUST NOT be under
#                                # workspace_dir (validate() rejects it if it is)
#   scratch_dir: /spf/tmp       # the transport's own scratch plane — same rule as handoff_dir
#   image: ""                   # opensandbox only. NO DEFAULT — required (must contain
#                                # git + tar + base64) when the resolved backend is opensandbox
#   setup: []                   # shell commands run ONCE per sandbox, after seeding
#                                #   e.g. ["npm ci --omit=dev"]
#   request_timeout_seconds: 960   # the SDK's client-side HTTP timeout on control-plane calls
#   lifetime_seconds: 3600         # provider-side expiry, renewed while a lease is live
#   max_total_lifetime_seconds: 21600  # hard ceiling from creation; renew refuses past it
#   exec_timeout_seconds: 900      # the DEFAULT per-command deadline (not a ceiling — a
#                                  # caller-supplied timeout is honored, never clamped)
#   env_allowlist: []           # e.g. ["GH_TOKEN"] — DEFAULT IS EMPTY, deliberately NOT the
#                                # operator env backend: local gets today. The set that
#                                # actually reaches a container is this list INTERSECTED
#                                # with that agent's own env_allowlist.
#   credentials:
#     broker: static             # static is the only broker in this build
#   egress:
#     default: deny              # deny | allow
#     allow: []                  # hostnames, e.g. ["registry.npmjs.org", "github.com"]
#   transport:
#     max_patch_bytes: 8388608     # 8 MiB — exceeding it FAILS the phase, never truncates
#     max_seed_bytes: 134217728    # 128 MiB seed archive ceiling
#     max_mirror_bytes: 4194304    # 4 MiB per handoff-mirror transfer, each direction
#     mirror: []                  # extra repo-relative paths to sync out that git can't carry
#   fanout: worktree             # worktree | sandbox (fan-out through sandboxes — later release)
#   opensandbox:
#     base_url: http://127.0.0.1:8090
#     api_key_env: OPENSANDBOX_API_KEY   # env KEY NAME, never the key itself
#     use_server_proxy: false
#     metadata_prefix: spf
#   cloudflare:
#     bridge_url: ""                     # a deployed @cloudflare/sandbox bridge
#     api_token_env: CLOUDFLARE_API_TOKEN
#     sandbox_name: ""                   # optional stable name; default derives from the lease key
#
# Per-agent backend override, added to an `agents[]` entry alongside `writes`/
# `env_allowlist` above — a bare backend name, never a nested block:
#   agents:
#     - name: builder
#       sandbox: opensandbox      # unset -> inherit sandbox.backend; "local" -> force local

agents:
  - name: planner
    model: fireworks/accounts/fireworks/models/kimi-k3
    thinking: high
    color: "#a78bfa"                 # optional hex — the agent's lane color in the visualizer
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: planner/system.md
      user: planner/user.md
    writes:                        # the plan is the only thing it may leave in the repo
      - specs/
    tools:                         # full recon + write for plan.md; no edit — the planner never touches repo files
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: builder
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: builder/system.md
      user: builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    tools:                         # the only agent that mutates the repo — everything on
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: scout
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: scout/system.md
      user: scout/user.md
    writes: []                     # read-only, and now actually read-only: its findings
                                   # go to context_handoff/, which is runtime, not the repo
    tools:                         # search-heavy recon; write only so scout_findings.md lands without a bash heredoc
      - read
      - grep
      - find
      - ls
      - bash
      - write

  # No tester agent: running the suite is a known command, so it is a kind="code"
  # phase over core/quality.ts. See SKILL.md hard rule 8.

  - name: refiner
    thinking: high
    color: "#34d399"
    purpose: Decompose a product spec into a feature/story-or-bug tree of vertical slices; change nothing.
    prompt_engineering:
      system: refiner/system.md
      user: refiner/user.md
    writes: []                     # read-only w.r.t. the repo; refine_plan.md lands in context_handoff_dir, not here
    tools:                         # full recon; write only for refine_plan.md, no edit
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: reviewer
    model: openai/gpt-5.6-terra
    thinking: high
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: reviewer/system.md
      user: reviewer/user.md
    writes: []                     # a reviewer that cannot fix cannot quietly fix — the
                                   # claim the tool list only implied, now enforced
    tools:                         # full read surface; write only for review.md, no edit
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: documenter
    model: openai/gpt-5.6-luna
    color: "#e879f9"
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: documenter/system.md
      user: documenter/user.md
    writes:                        # documentation only — "document only" is a rule now,
      - app_docs/                  # not a line in a prompt the model may drift from.
      - docs/                      # Markdown anywhere, because docs live next to the
      - "**/*.md"                  # code they describe as often as in a docs folder.
      - "*.md"
    tools:                         # reads the diff and the code; writes/edits documentation only
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - edit
